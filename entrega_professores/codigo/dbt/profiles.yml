suporte_dw:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', 'data/curated/warehouse.duckdb') }}"
      schema: analytics
      threads: 4
    # Alvo de producao em nuvem. Basta exportar as variaveis SNOWFLAKE_* e rodar
    # dbt --target snowflake. A mesma modelagem (sem alteracao de SQL) e' aplicada.
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', '') }}"
      user: "{{ env_var('SNOWFLAKE_USER', '') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD', '') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'SYSADMIN') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'SUPORTE_DW') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'COMPUTE_WH') }}"
      schema: "ANALYTICS"
      threads: 4
