AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Versao compativel com AWS Academy (Learner Lab). O Lab bloqueia a criacao de
  papeis IAM (iam:CreateRole), entao este template NAO cria roles: a funcao
  Lambda reutiliza o papel pre-existente LabRole. Provisiona o data lake em S3
  (3 camadas) e um LogGroup no CloudWatch. Nao usa MWAA (indisponivel no Lab).
  Observacao: para o requisito minimo do enunciado ("usar >=1 servico AWS"),
  basta o S3 - que funciona so com as credenciais temporarias do Lab, sem role.

Parameters:
  ProjectName:
    Type: String
    Default: suporte-ia
  LabRoleArn:
    Type: String
    Default: ""
    Description: >
      ARN do LabRole. Deixe vazio para usar automaticamente
      arn:aws:iam::<sua-conta>:role/LabRole (padrao do AWS Academy).
  CriarLambda:
    Type: String
    Default: "nao"
    AllowedValues: ["sim", "nao"]
    Description: Crie a Lambda de ingestao (opcional). Use "nao" para so o S3+Logs.

Conditions:
  UsarLabRolePadrao: !Equals [!Ref LabRoleArn, ""]
  ComLambda: !Equals [!Ref CriarLambda, "sim"]

Resources:

  RawBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-raw-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ProcessedBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-processed-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  CuratedBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-curated-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  PipelineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${ProjectName}/pipeline"
      RetentionInDays: 30

  # Lambda OPCIONAL - reutiliza o LabRole (nao cria role nova)
  IngestionFunction:
    Type: AWS::Lambda::Function
    Condition: ComLambda
    Properties:
      FunctionName: !Sub "${ProjectName}-ingestao"
      Runtime: python3.11
      Handler: index.handler
      Timeout: 120
      MemorySize: 256
      Role: !If
        - UsarLabRolePadrao
        - !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
        - !Ref LabRoleArn
      Environment:
        Variables:
          RAW_BUCKET: !Ref RawBucket
      Code:
        ZipFile: |
          import os, json, boto3, datetime
          def handler(event, context):
              s3 = boto3.client("s3")
              bucket = os.environ["RAW_BUCKET"]
              key = "ingestao/_heartbeat.json"
              s3.put_object(Bucket=bucket, Key=key,
                            Body=json.dumps({"em": datetime.datetime.utcnow().isoformat()}))
              return {"status": "ok", "bucket": bucket, "key": key}

Outputs:
  RawBucketName:
    Description: Bucket bruto (use como S3_BUCKET no s3_sync).
    Value: !Ref RawBucket
  ProcessedBucketName:
    Value: !Ref ProcessedBucket
  CuratedBucketName:
    Value: !Ref CuratedBucket
