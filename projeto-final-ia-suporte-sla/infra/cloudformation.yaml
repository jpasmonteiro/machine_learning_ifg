AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Infraestrutura base do pipeline de suporte tecnico (IFG - Pos IA - Modulo 2).
  Provisiona o data lake em camadas (S3), papel IAM, log group (CloudWatch) e uma
  funcao Lambda de ingestao agendada (EventBridge). Snowflake/dbt/Metabase ficam
  fora do CloudFormation (servicos externos/gerenciados), mas o S3 e' a fonte
  bruta consumida pelo pipeline.

Parameters:
  ProjectName:
    Type: String
    Default: suporte-ia
    Description: Prefixo usado no nome dos recursos.
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]

Resources:

  RawBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-raw-${Environment}-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expira-bruto-antigo
            Status: Enabled
            ExpirationInDays: 365

  ProcessedBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-processed-${Environment}-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  CuratedBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-curated-${Environment}-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  PipelineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${ProjectName}/${Environment}/pipeline"
      RetentionInDays: 30

  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-pipeline-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: [lambda.amazonaws.com, ec2.amazonaws.com]
            Action: sts:AssumeRole
      Policies:
        - PolicyName: acesso-data-lake-e-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:ListBucket]
                Resource:
                  - !GetAtt RawBucket.Arn
                  - !Sub "${RawBucket.Arn}/*"
                  - !GetAtt ProcessedBucket.Arn
                  - !Sub "${ProcessedBucket.Arn}/*"
                  - !GetAtt CuratedBucket.Arn
                  - !Sub "${CuratedBucket.Arn}/*"
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt PipelineLogGroup.Arn

  IngestionFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-ingestao-${Environment}"
      Runtime: python3.11
      Handler: index.handler
      Timeout: 120
      MemorySize: 256
      Role: !GetAtt PipelineRole.Arn
      Environment:
        Variables:
          RAW_BUCKET: !Ref RawBucket
      Code:
        ZipFile: |
          import os, json, boto3, datetime
          # Stub de ingestao: registra a chegada de dados na camada raw do S3.
          # Em producao, este handler coletaria os chamados da fonte e gravaria
          # os arquivos brutos (tickets.csv, messages.jsonl, events.json) no S3.
          def handler(event, context):
              s3 = boto3.client("s3")
              bucket = os.environ["RAW_BUCKET"]
              key = "ingestao/_heartbeat.json"
              body = json.dumps({"executado_em": datetime.datetime.utcnow().isoformat()})
              s3.put_object(Bucket=bucket, Key=key, Body=body)
              return {"status": "ok", "bucket": bucket, "key": key}

  IngestionSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-ingestao-diaria-${Environment}"
      ScheduleExpression: "cron(0 6 * * ? *)"
      State: ENABLED
      Targets:
        - Arn: !GetAtt IngestionFunction.Arn
          Id: ingestao-lambda

  PermissaoEventBridge:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref IngestionFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt IngestionSchedule.Arn

Outputs:
  RawBucketName:
    Description: Bucket da camada bruta (raw).
    Value: !Ref RawBucket
  ProcessedBucketName:
    Value: !Ref ProcessedBucket
  CuratedBucketName:
    Value: !Ref CuratedBucket
  PipelineRoleArn:
    Value: !GetAtt PipelineRole.Arn
  IngestionFunctionName:
    Value: !Ref IngestionFunction
